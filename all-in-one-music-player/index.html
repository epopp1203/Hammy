<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>All In One Music Player</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div id="app" class="app">
			<header class="topbar">
				<div class="brand">
					<p class="eyebrow">Tycoon UI Starter</p>
					<h1>All In One Music Player</h1>
					<p class="subtitle">A stylish in-game music hub for Spotify, Apple Music, YouTube, and more.</p>
				</div>
				<div class="topbar-actions">
					<button id="settings-toggle-btn" class="btn btn-secondary">Settings</button>
					<button id="connect-all-btn" class="btn btn-primary">Connect All</button>
				</div>
			</header>

			<main class="layout">
				<section class="card player-card">
					<div class="player-hero">
						<div class="cover-art" aria-label="Album cover">
							<span>♪</span>
						</div>
						<div class="player-meta">
							<div class="pill source-pill">Live Source</div>
							<h2 id="track-title">Midnight Drive</h2>
							<p id="track-artist">Nova Lane</p>
							<p id="track-album">Neon Echoes • 3:42</p>
						</div>
					</div>

					<div class="player-controls">
						<button id="prev-btn" class="btn btn-secondary">⏮</button>
						<button id="play-btn" class="btn btn-primary">Pause</button>
						<button id="next-btn" class="btn btn-secondary">⏭</button>
					</div>

					<div class="progress-area">
						<div class="progress-bar">
							<div class="progress-fill"></div>
						</div>
						<div class="progress-meta">
							<span>1:12</span>
							<span>3:42</span>
						</div>
					</div>

					<div class="volume-row">
						<label for="volume-range" class="volume-label">Volume</label>
						<input id="volume-range" type="range" min="0" max="100" value="76" />
					</div>
				</section>

				<aside class="sidebar">
					<section class="card">
						<div class="card-header">
							<h3>Connected Services</h3>
							<span class="pill">OAuth Ready</span>
						</div>
						<div id="service-list" class="service-list"></div>
					</section>

					<section class="card">
						<div class="card-header">
							<h3>Queue</h3>
							<span class="pill">6 tracks</span>
						</div>
						<ul id="queue-list" class="queue-list"></ul>
					</section>
				</aside>
			</main>
		</div>

		<aside id="settings-panel" class="settings-panel hidden" aria-label="Music player settings">
			<div class="settings-header">
				<h3>Appearance</h3>
				<button id="settings-close-btn" class="icon-btn" aria-label="Close settings">×</button>
			</div>
			<div class="settings-content">
				<label class="setting-row stacked">
					<div class="setting-inline-row">
						<span>Theme</span>
						<span id="theme-value">Aurora</span>
					</div>
					<select id="theme-select">
						<option value="aurora">Aurora</option>
						<option value="midnight">Midnight</option>
						<option value="sunset">Sunset</option>
						<option value="neon">Neon</option>
						<option value="ocean">Ocean</option>
					</select>
				</label>
				<label class="setting-row stacked">
					<div class="setting-inline-row">
						<span>Font Size</span>
						<span id="font-size-value">100%</span>
					</div>
					<input id="font-size-input" type="range" min="0.85" max="1.3" step="0.01" value="1" />
				</label>
				<label class="setting-row stacked">
					<div class="setting-inline-row">
						<span>Window Opacity</span>
						<span id="opacity-value">82%</span>
					</div>
					<input id="opacity-input" type="range" min="0.4" max="1" step="0.01" value="0.82" />
				</label>
			</div>
		</aside>

		<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

		<script src="script.js"></script>
	</body>
</html>
